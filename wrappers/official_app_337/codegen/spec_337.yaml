    count: ncon
  - id: data_contact_geom2
    name: data_contact_geom2
    owner: mjData
    base: contact
    struct: mjContact
    field: geom2
    dtype: i32
    width: 1
    len: nconmax
    count: ncon
  - id: data_contact_geom
    name: data_contact_geom
    owner: mjData
    base: contact
    struct: mjContact
    field: geom
    dtype: i32
    width: 2
    array: true
