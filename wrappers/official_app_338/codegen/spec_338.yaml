headers:
  search:
    - ../../../external/mujoco/include/mujoco
    - ../../../local_tools/external/mujoco/include/mujoco
    - ../../external/mujoco/include/mujoco
    - ../../local_tools/external/mujoco/include/mujoco
  mjModel: mjmodel.h
  mjData: mjdata.h
  report_json: ../build/export_rules_report.json

scan:
  structs: ../../dist/3.3.8-alpha/abi/structs.json
  dim_map: ../../dist/3.3.8-alpha/abi/dim_map.json

dims:
  nq: m->nq
  nv: m->nv
  nu: m->nu
  nsensordata: m->nsensordata
  ngeom: m->ngeom
  nmat: m->nmat
  njnt: m->njnt
  nmesh: m->nmesh
  nbody: m->nbody
  na: m->na
  nsite: m->nsite
  ncam: m->ncam
  nlight: m->nlight
  ntendon: m->ntendon
  nwrap: m->nwrap
  nsensor: m->nsensor
  nmocap: m->nmocap
  nuserdata: m->nuserdata
  nplugin: m->nplugin
  npluginstate: m->npluginstate
  npluginattr: m->npluginattr
  nbvh: m->nbvh
  nbvhstatic: m->nbvhstatic
  nbvhdynamic: m->nbvhdynamic
  nmeshvert: m->nmeshvert
  nmeshnormal: m->nmeshnormal
  nmeshtexcoord: m->nmeshtexcoord
  nmeshface: m->nmeshface
  nhfield: m->nhfield
  nhfielddata: m->nhfielddata
  ntex: m->ntex
  ntexdata: m->ntexdata

counts:
  - id: mesh_vert_total
    name: mesh_vert_count
    struct: mjModel
    field: mesh_vertnum
    dim: nmesh
    mode: sum
  - id: mesh_face_total
    name: mesh_face_count
    struct: mjModel
    field: mesh_facenum
    dim: nmesh
    mode: sum
  - id: mesh_texcoord_total
    name: mesh_texcoord_count
    struct: mjModel
    field: mesh_texcoordnum
    dim: nmesh
    mode: sum

rules:
  - id: data_qpos
    struct: mjData
    match: '^qpos$'
    dtype: f64
    len: 'nq'
  - id: data_qvel
    struct: mjData
    match: '^qvel$'
    dtype: f64
    len: 'nv'
  - id: data_ctrl
    struct: mjData
    match: '^ctrl$'
    dtype: f64
    len: 'nu'
  - id: data_sensordata
    struct: mjData
    match: '^sensordata$'
    dtype: f64
    len: 'nsensordata'
  - id: data_geom_xpos
    struct: mjData
    match: '^geom_xpos$'
    dtype: f64
    len: 'ngeom*3'
  - id: data_geom_xmat
    struct: mjData
    match: '^geom_xmat$'
    dtype: f64
    len: 'ngeom*9'
  - id: data_xfrc_applied
    struct: mjData
    match: '^xfrc_applied$'
    dtype: f64
    len: 'nbody*6'

  - id: model_geom_size
    struct: mjModel
    match: '^geom_size$'
    dtype: f64
    len: 'ngeom*3'
  - id: model_geom_type
    struct: mjModel
    match: '^geom_type$'
    dtype: i32
    len: 'ngeom'
  - id: model_geom_matid
    struct: mjModel
    match: '^geom_matid$'
    dtype: i32
    len: 'ngeom'
  - id: model_geom_bodyid
    struct: mjModel
    match: '^geom_bodyid$'
    dtype: i32
    len: 'ngeom'
  - id: model_geom_dataid
    struct: mjModel
    match: '^geom_dataid$'
    dtype: i32
    len: 'ngeom'
  - id: model_mat_rgba
    struct: mjModel
    match: '^mat_rgba$'
    dtype: f32
    len: 'nmat*4'

  - id: model_mesh_index_arrays
    struct: mjModel
    match: '^mesh_(vertadr|vertnum|faceadr|facenum|texcoordadr|texcoordnum)$'
    dtype: i32
    len: 'nmesh'
  - id: model_mesh_vert
    struct: mjModel
    match: '^mesh_vert$'
    dtype: f32
    len: 'mesh_vert_count*3'
    export_count: mesh_vert_count
  - id: model_mesh_face
    struct: mjModel
    match: '^mesh_face$'
    dtype: i32
    len: 'mesh_face_count*3'
    export_count: mesh_face_count
  - id: model_mesh_normal
    struct: mjModel
    match: '^mesh_normal$'
    dtype: f32
    len: 'mesh_vert_count*3'
  - id: model_mesh_texcoord
    struct: mjModel
    match: '^mesh_texcoord$'
    dtype: f32
    len: 'mesh_texcoord_count*2'
    export_count: mesh_texcoord_count

  - id: model_jnt_type
    struct: mjModel
    match: '^jnt_type$'
    dtype: i32
    len: 'njnt'
  - id: model_jnt_qposadr
    struct: mjModel
    match: '^jnt_qposadr$'
    dtype: i32
    len: 'njnt'
  - id: model_jnt_range
    struct: mjModel
    match: '^jnt_range$'
    dtype: f64
    len: 'njnt*2'
  - id: model_actuator_ctrlrange
    struct: mjModel
    match: '^actuator_ctrlrange$'
    dtype: f64
    len: 'nu*2'

auto: []

names:
  enabled: true
