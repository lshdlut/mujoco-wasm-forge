headers:
  search:
    - ../../../external/mujoco/include/mujoco
    - ../../../local_tools/external/mujoco/include/mujoco
    - ../../external/mujoco/include/mujoco
    - ../../local_tools/external/mujoco/include/mujoco
  mjModel: mjmodel.h
  mjData: mjdata.h
  report_json: ../build/export_rules_report.json

scan:
  structs: ../../dist/3.2.5/abi/structs.json
  dim_map: ../../dist/3.2.5/abi/dim_map.json

dims:
  nq: m->nq
  nv: m->nv
  nu: m->nu
  nsensordata: m->nsensordata
  ngeom: m->ngeom
  nmat: m->nmat
  njnt: m->njnt
  nmesh: m->nmesh
  nbody: m->nbody

counts:
  - id: mesh_vert_total
    name: mesh_vert_count
    struct: mjModel
    field: mesh_vertnum
    dim: nmesh
    mode: sum
  - id: mesh_face_total
    name: mesh_face_count
    struct: mjModel
    field: mesh_facenum
    dim: nmesh
    mode: sum
  - id: mesh_texcoord_total
    name: mesh_texcoord_count
    struct: mjModel
    field: mesh_texcoordnum
    dim: nmesh
    mode: sum

rules:
  # Core mjData state
  - id: data_qpos
    struct: mjData
    match: '^qpos$'
    dtype: f64
    len: 'nq'
  - id: data_qvel
    struct: mjData
    match: '^qvel$'
    dtype: f64
    len: 'nv'
  - id: data_ctrl
    struct: mjData
    match: '^ctrl$'
    dtype: f64
    len: 'nu'
  - id: data_sensordata
    struct: mjData
    match: '^sensordata$'
    dtype: f64
    len: 'nsensordata'
  - id: data_geom_xpos
    struct: mjData
    match: '^geom_xpos$'
    dtype: f64
    len: 'ngeom*3'
  - id: data_geom_xmat
    struct: mjData
    match: '^geom_xmat$'
    dtype: f64
    len: 'ngeom*9'
  - id: data_xfrc_applied
    struct: mjData
    match: '^xfrc_applied$'
    dtype: f64
    len: 'nbody*6'

  # mjModel geometry and materials
  - id: model_geom_size
    struct: mjModel
    match: '^geom_size$'
    dtype: f64
    len: 'ngeom*3'
  - id: model_geom_type
    struct: mjModel
    match: '^geom_type$'
    dtype: i32
    len: 'ngeom'
  - id: model_geom_matid
    struct: mjModel
    match: '^geom_matid$'
    dtype: i32
    len: 'ngeom'
  - id: model_geom_bodyid
    struct: mjModel
    match: '^geom_bodyid$'
    dtype: i32
    len: 'ngeom'
  - id: model_geom_dataid
    struct: mjModel
    match: '^geom_dataid$'
    dtype: i32
    len: 'ngeom'
  - id: model_mat_rgba
    struct: mjModel
    match: '^mat_rgba$'
    dtype: f32
    len: 'nmat*4'

  # Mesh descriptors
  - id: model_mesh_index_arrays
    struct: mjModel
    match: '^mesh_(vertadr|vertnum|faceadr|facenum|texcoordadr|texcoordnum)$'
    dtype: i32
    len: 'nmesh'
  - id: model_mesh_vert
    struct: mjModel
    match: '^mesh_vert$'
    dtype: f32
    len: 'mesh_vert_count*3'
    export_count: mesh_vert_count
  - id: model_mesh_face
    struct: mjModel
    match: '^mesh_face$'
    dtype: i32
    len: 'mesh_face_count*3'
    export_count: mesh_face_count
  - id: model_mesh_normal
    struct: mjModel
    match: '^mesh_normal$'
    dtype: f32
    len: 'mesh_vert_count*3'
  - id: model_mesh_texcoord
    struct: mjModel
    match: '^mesh_texcoord$'
    dtype: f32
    len: 'mesh_texcoord_count*2'
    export_count: mesh_texcoord_count

auto:
  - id: auto_model_scalars
    struct: mjModel
    match: '^(body_|jnt_|dof_|geom_|site_|cam_|light_|mat_|tex_|hfield_|tendon_|sensor_|actuator_|eq_|wrap_|pair_|exclude_|numeric_|text_|tuple_|key_|plugin_|name_|names$|path_|paths$|skin_|flex_|bvh_|mocap_|qpos)'
    allow_types:
      - mjtNum
      - float
      - int
      - unsigned int
      - int32_t
      - mjtByte
      - uint8_t
      - unsigned char
      - char
      - uintptr_t
    len_from_comment: true
    dtype: auto
  - id: auto_data_scalars
    struct: mjData
    match: '.*'
    allow_types:
      - mjtNum
      - float
      - int
      - unsigned int
      - int32_t
      - mjtByte
      - uint8_t
      - unsigned char
      - char
      - uintptr_t
      - unsigned short
    len_from_comment: true
    dtype: auto

names:
  enabled: true

