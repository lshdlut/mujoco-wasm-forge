name: forge-dist-verify

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'forge-*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "MuJoCo version (deliverables/<ver>) to verify (optional)."
        required: false
        type: string

jobs:
  unit-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run no-SDK generator and packaging contracts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import importlib.util
          import sys
          import unittest
          from pathlib import Path

          repo = Path.cwd()
          sys.path.insert(0, str(repo))
          test_path = repo / "check" / "tests" / "generator-types.py"
          spec = importlib.util.spec_from_file_location("generator_types_contract", test_path)
          if spec is None or spec.loader is None:
            raise SystemExit(f"cannot load {test_path}")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          all_tests = unittest.TestLoader().loadTestsFromTestCase(module.GeneratorTypes)
          selected = [
              test for test in all_tests
              if not test.id().endswith(".test_checked_narrowing_in_wasm")
          ]
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          python3 -m unittest discover -s tests -p 'test_package_release*.py'

          version="$(python3 - <<'PY'
          from pathlib import Path
          from dist_version import version_sort_key

          versions = [path.name for path in Path("deliverables").iterdir() if path.is_dir()]
          if not versions:
            raise SystemExit("no deliverables available for the packaging contract")
          print(max(versions, key=version_sort_key))
          PY
          )"
          out_dir="${RUNNER_TEMP}/forge-packager-contract-${version}"
          python3 tools/package_release_assets.py \
            --dist-dir deliverables \
            --version "${version}" \
            --dist-id ci-unit-contract \
            --git-sha "${GITHUB_SHA:-unit-contract}" \
            --out-dir "${out_dir}"
          test -s "${out_dir}/dist-runtime.zip"
          test -s "${out_dir}/dist-audit.zip"

  select-dist-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.select.outputs.versions }}
      has_versions: ${{ steps.select.outputs.has_versions }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout baseline (with committed deliverables/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          
          from dist_version import version_sort_key
          from forge_cli import _paths_for_build_selection
          
          
          def _write_output(key: str, value: str) -> None:
            out_path = os.environ.get("GITHUB_OUTPUT")
            if not out_path:
              raise RuntimeError("GITHUB_OUTPUT is missing")
            with open(out_path, "a", encoding="utf-8") as handle:
              handle.write(f"{key}={value}\n")
          
          
          def _git_diff_paths(base: str, head: str) -> list[str]:
            res = subprocess.run(
              ["git", "diff", "--name-status", "-M", base, head],
              check=True,
              stdout=subprocess.PIPE,
              text=True,
            )
            return _paths_for_build_selection(res.stdout)
          
          
          def _extract_dist_versions(paths: list[str]) -> list[str]:
            versions: set[str] = set()
            for path in paths:
              if not path.startswith("deliverables/"):
                continue
              parts = path.split("/", 2)
              if len(parts) >= 2 and parts[1]:
                versions.add(parts[1])
            return sorted(versions, key=version_sort_key)
          
          
          def _list_dist_versions() -> list[str]:
            root = Path("deliverables")
            if not root.is_dir():
              return []
            return sorted([p.name for p in root.iterdir() if p.is_dir()], key=version_sort_key)
          
          
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          head_sha = os.environ.get("GITHUB_SHA", "")
          before_sha = os.environ.get("GITHUB_EVENT_BEFORE", "")
          pr_base_sha = os.environ.get("GITHUB_EVENT_PR_BASE", "")
          input_version = (os.environ.get("INPUT_VERSION") or "").strip()
          
          versions: list[str] = []
          reason = "none"
          
          if input_version:
            versions = [input_version]
            reason = "workflow_dispatch input"
          elif ref_type == "tag" and ref_name.startswith("forge-"):
            tag_payload = ref_name[len("forge-") :]
            # Accept forge-3.3.7-r1 and forge-3.3.8-alpha1.
            tag_payload = re.sub(r"-r\d+$", "", tag_payload)
            versions = [tag_payload]
            reason = "tag"
          else:
            base_sha = pr_base_sha if event_name == "pull_request" else before_sha
            if base_sha and not re.fullmatch(r"0+", base_sha):
              paths = _git_diff_paths(base_sha, head_sha)
            else:
              # Fallback: assume last commit if base SHA is unavailable.
              paths = _git_diff_paths(f"{head_sha}~1", head_sha)
          
            dist_versions = _extract_dist_versions(paths)
            if dist_versions:
              versions = dist_versions
              reason = "deliverables changed"
            else:
              # When pipeline code changes (but deliverables/ isn't updated yet), run a single
              # canary verify on the latest committed deliverable version.
              relevant_prefixes = (
                "forge_cli.py",
                "app/",
                "abi_impl/",
                "abi_exports/",
                "introspect/",
                "check/",
                ".github/workflows/",
              )
              has_relevant_change = any(
                path == "forge_cli.py" or any(path.startswith(prefix) for prefix in relevant_prefixes if prefix.endswith("/"))
                for path in paths
              )
              if has_relevant_change:
                all_versions = _list_dist_versions()
                if all_versions:
                  versions = [all_versions[-1]]
                  reason = "pipeline changed (canary latest)"
          
          _write_output("has_versions", "true" if versions else "false")
          _write_output("versions", json.dumps(versions))
          _write_output("reason", reason)
          print(f"[forge-dist-verify] selected versions={versions} reason={reason}")
          PY
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_PR_BASE: ${{ github.event.pull_request.base.sha }}

  verify-dist:
    needs: select-dist-versions
    if: needs.select-dist-versions.outputs.has_versions == 'true'
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: '4.0.10'
    strategy:
      fail-fast: false
      matrix:
        ver: ${{ fromJson(needs.select-dist-versions.outputs.versions) }}

    steps:
      - name: Checkout baseline (with committed deliverables/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Checkout repo for reproducible build
        uses: actions/checkout@v4
        with:
          path: ci-build
          fetch-depth: 0

      - name: Install dependencies (ci-build)
        working-directory: ci-build
        run: npm install

      - name: Build dist-ci for ${{ matrix.ver }}
        working-directory: ci-build
        env:
          EMSDK_VERSION: ${{ env.EMSDK_VERSION }}
          QUALITY_ENFORCE: '1'
        run: |
          set -euxo pipefail
          PYTHONPATH=. python3 check/tests/generator-types.py
          python3 forge_cli.py build --version ${{ matrix.ver }} --with-checks
          if [[ -d "../deliverables/${{ matrix.ver }}/pthreads" ]]; then
            python3 forge_cli.py build --version ${{ matrix.ver }} --pthreads --fresh-dependency --with-checks
          fi

      - name: Browser upgrade smoke for MuJoCo >= 3.15
        working-directory: ci-build
        env:
          # Stable 1.63.0 is the same Playwright generation as the local
          # browser-tools module used to validate this runner.
          PLAYWRIGHT_VERSION: '1.63.0'
        run: |
          set -euxo pipefail
          if ! python3 - "${{ matrix.ver }}" <<'PY'
          import sys

          major, minor, patch = (int(part) for part in sys.argv[1].split('-', 1)[0].split('.'))
          raise SystemExit(0 if (major, minor, patch) >= (3, 15, 0) else 1)
          PY
          then
            echo "[browser-smoke] skipped ${{ matrix.ver }}: browser gate requires MuJoCo >= 3.15.0; Node checks still run"
            exit 0
          fi

          npm install --no-save --ignore-scripts --package-lock=false "playwright@${PLAYWRIGHT_VERSION}"
          npx --no-install playwright install --with-deps chromium
          runtime_root="${RUNNER_TEMP}/mujoco-wasm-forge-browser-${{ matrix.ver }}"
          node check/browser_upgrade_smoke/runner.mjs \
            --dist-root "dist/${{ matrix.ver }}" \
            --version "${{ matrix.ver }}" \
            --runtime-root "${runtime_root}" \
            --output "${runtime_root}/browser-upgrade-result.json"

      - name: Verify dist matches reproducible build
        run: |
          set -euxo pipefail
          python3 forge_cli.py verify-dist --version "${{ matrix.ver }}"

  release-dist:
    needs: [select-dist-versions, verify-dist]
    if: startsWith(github.ref, 'refs/tags/forge-') && needs.select-dist-versions.outputs.has_versions == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout baseline (with committed deliverables/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package release assets
        shell: bash
        env:
          DIST_VERSION: ${{ fromJson(needs.select-dist-versions.outputs.versions)[0] }}
          DIST_ID: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ver="${DIST_VERSION}"
          dist_id="${DIST_ID#forge-}"
          if [[ ! -d "deliverables/${ver}" ]]; then
            echo "[release] deliverables/${ver} missing" >&2
            exit 1
          fi

          rm -rf release-root dist-runtime.zip dist-audit.zip
          python3 tools/package_release_assets.py \
            --dist-dir deliverables \
            --version "${ver}" \
            --dist-id "${dist_id}" \
            --git-sha "${GIT_SHA}" \
            --out-dir .

          echo "[release] packaged dist-runtime.zip + dist-audit.zip for distId=${dist_id} ver=${ver}"

      - name: Publish release assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-runtime.zip
            dist-audit.zip
          fail_on_unmatched_files: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
