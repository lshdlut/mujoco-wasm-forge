name: forge-dist-verify

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'forge-*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "MuJoCo version (dist/<ver>) to verify (optional)."
        required: false
        type: string

jobs:
  select-dist-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.select.outputs.versions }}
      has_versions: ${{ steps.select.outputs.has_versions }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout baseline (with committed dist/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          
          
          def _write_output(key: str, value: str) -> None:
            out_path = os.environ.get("GITHUB_OUTPUT")
            if not out_path:
              raise RuntimeError("GITHUB_OUTPUT is missing")
            with open(out_path, "a", encoding="utf-8") as handle:
              handle.write(f"{key}={value}\n")
          
          
          def _git_diff_paths(base: str, head: str) -> list[str]:
            res = subprocess.run(
              ["git", "diff", "--name-only", base, head],
              check=True,
              stdout=subprocess.PIPE,
              text=True,
            )
            return [line.strip() for line in res.stdout.splitlines() if line.strip()]
          
          
          def _extract_dist_versions(paths: list[str]) -> list[str]:
            versions: set[str] = set()
            for path in paths:
              if not path.startswith("dist/"):
                continue
              parts = path.split("/", 2)
              if len(parts) >= 2 and parts[1]:
                versions.add(parts[1])
            return sorted(versions)
          
          
          def _list_dist_versions() -> list[str]:
            root = Path("dist")
            if not root.is_dir():
              return []
            return sorted([p.name for p in root.iterdir() if p.is_dir()])
          
          
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          head_sha = os.environ.get("GITHUB_SHA", "")
          before_sha = os.environ.get("GITHUB_EVENT_BEFORE", "")
          pr_base_sha = os.environ.get("GITHUB_EVENT_PR_BASE", "")
          input_version = (os.environ.get("INPUT_VERSION") or "").strip()
          
          versions: list[str] = []
          reason = "none"
          
          if input_version:
            versions = [input_version]
            reason = "workflow_dispatch input"
          elif ref_type == "tag" and ref_name.startswith("forge-"):
            tag_payload = ref_name[len("forge-") :]
            # Accept forge-3.3.7-r1 and forge-3.3.8-alpha1.
            tag_payload = re.sub(r"-r\d+$", "", tag_payload)
            versions = [tag_payload]
            reason = "tag"
          else:
            base_sha = pr_base_sha if event_name == "pull_request" else before_sha
            if base_sha and not re.fullmatch(r"0+", base_sha):
              paths = _git_diff_paths(base_sha, head_sha)
            else:
              # Fallback: assume last commit if base SHA is unavailable.
              paths = _git_diff_paths(f"{head_sha}~1", head_sha)
          
            dist_versions = _extract_dist_versions(paths)
            if dist_versions:
              versions = dist_versions
              reason = "dist changed"
            else:
              # When pipeline code changes (but dist/ isn't updated yet), run a single
              # canary verify on the latest committed dist version.
              relevant_prefixes = (
                "forge_cli.py",
                "app/",
                "abi_impl/",
                "abi_exports/",
                "introspect/",
                "check/",
                ".github/workflows/",
              )
              has_relevant_change = any(
                path == "forge_cli.py" or any(path.startswith(prefix) for prefix in relevant_prefixes if prefix.endswith("/"))
                for path in paths
              )
              if has_relevant_change:
                all_versions = _list_dist_versions()
                if all_versions:
                  versions = [all_versions[-1]]
                  reason = "pipeline changed (canary latest)"
          
          _write_output("has_versions", "true" if versions else "false")
          _write_output("versions", json.dumps(versions))
          _write_output("reason", reason)
          print(f"[forge-dist-verify] selected versions={versions} reason={reason}")
          PY
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_PR_BASE: ${{ github.event.pull_request.base.sha }}

  verify-dist:
    needs: select-dist-versions
    if: needs.select-dist-versions.outputs.has_versions == 'true'
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: '4.0.10'
    strategy:
      fail-fast: false
      matrix:
        ver: ${{ fromJson(needs.select-dist-versions.outputs.versions) }}

    steps:
      - name: Checkout baseline (with committed dist/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Checkout repo for reproducible build
        uses: actions/checkout@v4
        with:
          path: ci-build
          fetch-depth: 0

      - name: Install dependencies (ci-build)
        working-directory: ci-build
        run: npm install

      - name: Build dist-ci for ${{ matrix.ver }}
        working-directory: ci-build
        env:
          EMSDK_VERSION: ${{ env.EMSDK_VERSION }}
        run: |
          set -euxo pipefail
          python3 forge_cli.py build --version ${{ matrix.ver }}

      - name: Verify dist matches reproducible build
        run: |
          set -euxo pipefail
          python3 forge_cli.py verify-dist --version "${{ matrix.ver }}"
