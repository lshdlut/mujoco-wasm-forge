name: forge-dist-verify

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'forge-*'
  pull_request:
    branches:
      - main
      - master

jobs:
  collect-dist-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.collect.outputs.versions }}
      has_versions: ${{ steps.collect.outputs.has_versions }}
    steps:
      - name: Checkout baseline (with committed dist/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: collect
        run: |
          set -euxo pipefail
          python3 forge_cli.py collect-versions --github-output >> "$GITHUB_OUTPUT"

  verify-dist:
    needs: collect-dist-versions
    if: needs.collect-dist-versions.outputs.has_versions == 'true'
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: '4.0.10'
    strategy:
      fail-fast: false
      matrix:
        ver: ${{ fromJson(needs.collect-dist-versions.outputs.versions) }}

    steps:
      - name: Checkout baseline (with committed dist/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Checkout repo for reproducible build
        uses: actions/checkout@v4
        with:
          path: ci-build
          fetch-depth: 0

      - name: Install dependencies (ci-build)
        working-directory: ci-build
        run: npm install

      - name: Build dist-ci for ${{ matrix.ver }}
        working-directory: ci-build
        env:
          EMSDK_VERSION: ${{ env.EMSDK_VERSION }}
        run: |
          set -euxo pipefail
          python3 forge_cli.py build --version ${{ matrix.ver }}

      - name: Verify dist matches reproducible build
        run: |
          set -euxo pipefail
          python3 forge_cli.py verify-dist --version "${{ matrix.ver }}"
