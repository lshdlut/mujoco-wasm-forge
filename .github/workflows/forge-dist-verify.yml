name: forge-dist-verify

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'forge-*'
  pull_request:
    branches:
      - main
      - master

jobs:
  collect-dist-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.collect.outputs.versions }}
      has_versions: ${{ steps.collect.outputs.has_versions }}
    steps:
      - name: Checkout baseline (with committed dist/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: collect
        run: |
          set -euxo pipefail
          versions=$(python3 - <<'PY' | tr -d '\n'
import json
from pathlib import Path

dist = Path('dist')
if not dist.exists():
    print(json.dumps([]))
else:
    versions = sorted(p.name for p in dist.iterdir() if p.is_dir())
    print(json.dumps(versions))
PY
          )
          if [ "$versions" = "[]" ]; then
            echo "has_versions=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_versions=true" >> "$GITHUB_OUTPUT"
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  verify-dist:
    needs: collect-dist-versions
    if: needs.collect-dist-versions.outputs.has_versions == 'true'
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: '4.0.10'
    strategy:
      fail-fast: false
      matrix:
        ver: ${{ fromJson(needs.collect-dist-versions.outputs.versions) }}

    steps:
      - name: Checkout baseline (with committed dist/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Checkout repo for reproducible build
        uses: actions/checkout@v4
        with:
          path: ci-build
          fetch-depth: 0

      - name: Install dependencies (ci-build)
        working-directory: ci-build
        run: npm install

      - name: Build dist-ci for ${{ matrix.ver }}
        working-directory: ci-build
        env:
          EMSDK_VERSION: ${{ env.EMSDK_VERSION }}
          META: '1'
          RUN_TESTS: '0'
        run: |
          npm run build:forge -- ${{ matrix.ver }}

      - name: Verify dist matches reproducible build
        run: |
          set -euxo pipefail
          BASE="dist/${{ matrix.ver }}"
          CI_COPY="ci-build/dist/${{ matrix.ver }}"
          test -d "$BASE"
          test -d "$CI_COPY"
          sanitize_meta() {
            local dir="$1"
            # Normalize human-readable timestamp in exports_report.md
            if [ -f "$dir/abi/exports_report.md" ]; then
              sed -i 's/^Generated at: .*/Generated at: NORMALIZED_TIME/' "$dir/abi/exports_report.md" || true
            fi
            # Normalize JSON generatedAt fields in mjapi.json and wrapper_exports.json
            for f in "$dir/abi/mjapi.json" "$dir/abi/wrapper_exports.json"; do
              if [ -f "$f" ]; then
                sed -i 's/"generatedAt": *"[^"]*"/"generatedAt": "NORMALIZED_TIME"/' "$f" || true
              fi
            done
          }
          sanitize_meta "$BASE"
          sanitize_meta "$CI_COPY"
          diff -ru "$BASE" "$CI_COPY"
